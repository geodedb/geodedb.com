# Pre-commit configuration for GeodeDB Website (Hugo)
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: ^(public/|resources/)
  - id: end-of-file-fixer
    exclude: ^(public/|resources/)
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^(public/|resources/)
  - id: check-yaml
    args: [--unsafe]
    exclude: ^(public/|resources/)
  - id: check-json
    exclude: ^(public/|resources/|layouts/)
  - id: check-toml
  - id: detect-private-key
  - id: check-added-large-files
    args: [--maxkb=2048]
    exclude: ^(public/|resources/|static/)
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
    exclude: ^(public/|resources/)
  - id: check-shebang-scripts-are-executable
    exclude: ^(public/|resources/)

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error, --shell=bash]

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD025, MD033, MD036, MD041, MD024, --]
    exclude: ^(CHANGELOG\.md|public/|resources/)

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml|public/|resources/)

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.2
  hooks:
  - id: commitizen
    stages: [commit-msg]

- repo: local
  hooks:
  - id: hugo-build
    name: hugo build (check)
    entry: bash -c 'hugo --minify; rc=$?; git checkout -- hugo_stats.json 2>/dev/null; exit $rc'
    language: system
    files: \.(html|md|toml|yaml|json)$
    exclude: ^(public/|resources/)
    pass_filenames: false
    stages: [pre-push]

  - id: check-todos
    name: check for TODOs/FIXMEs
    entry: bash
    args:
    - -c
    - |
      git diff --cached --name-only | xargs grep -l -E "(TODO|FIXME|XXX|HACK)" 2>/dev/null && echo "Warning: Found TODO/FIXME markers in staged files" && exit 0 || exit 0
    language: system
    pass_filenames: false
    verbose: true

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  skip: [hugo-build]
  submodules: false
