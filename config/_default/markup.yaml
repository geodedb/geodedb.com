goldmark:
  renderer:
    unsafe: true
    hardWraps: false
  parser:
    autoHeadingID: true
    autoHeadingIDType: github
  extensions:
    definitionList: true
    footnote: true
    linkify: true
    strikethrough: true
    table: true
    taskList: true
    typographer: true

highlight:
  anchorLineNos: false
  codeFences: true
  guessSyntax: true
  hl_Lines: ""
  hl_inline: false
  lineAnchors: ""
  lineNoStart: 1
  lineNos: false
  lineNumbersInTable: true
  noClasses: false
  noHl: false
  style: monokai
  tabWidth: 4

tableOfContents:
  endLevel: 4
  ordered: false
  startLevel: 2
