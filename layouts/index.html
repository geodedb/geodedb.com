{{/* layouts/index.html - Simple homepage layout */}}

{{ define "main" }}
  {{/* Optional hero / banner -------------------------------------------- */}}
  {{ with site.Params.main.banner }}
    {{ partial "banner.html" . }}
  {{ end }}

  <!-- =================================================================== -->
  <!--  Main homepage content                                              -->
  <!-- =================================================================== -->
  <div class="container my-5" itemprop="mainContentOfPage">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <!-- Render the markdown content from content/_index.md -->
        <article class="homepage-content">
          {{ .Content }}
        </article>
      </div>
    </div>
  </div>
{{ end }}
