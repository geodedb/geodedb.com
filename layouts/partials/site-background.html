{{/* Global animated background (light/dark variants) */}}
<div class="site-bg" aria-hidden="true">
  <svg class="site-bg__svg site-bg__svg--dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#120b1c">
          <animate attributeName="stop-color" dur="60s" repeatCount="indefinite"
                   values="#120b1c;#1a1028;#120b1c"/>
        </stop>
        <stop offset="55%" stop-color="#1a0f2a">
          <animate attributeName="stop-color" dur="60s" repeatCount="indefinite"
                   values="#1a0f2a;#2a1240;#1a0f2a"/>
        </stop>
        <stop offset="100%" stop-color="#0a0614">
          <animate attributeName="stop-color" dur="60s" repeatCount="indefinite"
                   values="#0a0614;#140c1e;#0a0614"/>
        </stop>
      </linearGradient>

      <radialGradient id="fadeGrad-dark" cx="50%" cy="50%" r="72%">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="62%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="fade-dark" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
        <rect width="1200" height="800" fill="url(#fadeGrad-dark)"/>
      </mask>

      <filter id="warp-dark" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="8" result="noise">
          <animate attributeName="baseFrequency" dur="40s" repeatCount="indefinite"
                   values="0.0035;0.006;0.0035"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <pattern id="triA-dark" width="180" height="155.884572681" patternUnits="userSpaceOnUse">
        <path class="lineA-dark" d="
          M0 0 H180
          M0 155.884572681 H180
          M0 0 L90 155.884572681 L180 0
          M0 155.884572681 L90 0 L180 155.884572681
        "/>
      </pattern>

      <pattern id="triB-dark" width="120" height="103.923048454" patternUnits="userSpaceOnUse">
        <path class="lineB-dark" d="
          M0 0 H120
          M0 103.923048454 H120
          M0 0 L60 103.923048454 L120 0
          M0 103.923048454 L60 0 L120 103.923048454
        "/>
        <circle class="dot-dark dot1" cx="0" cy="0" r="1.4"/>
        <circle class="dot-dark dot2" cx="60" cy="103.923048454" r="1.4"/>
        <circle class="dot-dark dot1" cx="120" cy="0" r="1.4"/>
        <circle class="dot-dark dot2" cx="0" cy="103.923048454" r="1.4"/>
        <circle class="dot-dark dot1" cx="120" cy="103.923048454" r="1.4"/>
      </pattern>

      <radialGradient id="vignette-dark" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
      </radialGradient>
    </defs>

    <style>
      .lineA-dark, .lineB-dark { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .lineA-dark { stroke: rgba(177,123,246,0.38); stroke-width: 1.1; stroke-dasharray: 10 22; animation: dashA 30s linear infinite; }
      .lineB-dark { stroke: rgba(133,59,213,0.36); stroke-width: 1.0; stroke-dasharray: 5 18;  animation: dashB 40s linear infinite; }

      .dot-dark { fill: rgba(189,143,255,0.45); }
      .dot1 { animation: twinkle1 10s ease-in-out infinite; }
      .dot2 { animation: twinkle2 12s ease-in-out infinite; }

      #grid1-dark, #grid2-dark { transform-origin: 600px 400px; }
      #grid1-dark { animation: drift1 120s linear infinite; opacity: 0.9; }
      #grid2-dark { animation: drift2 160s linear infinite; opacity: 0.55; mix-blend-mode: screen; }

      @keyframes drift1 {
        0%   { transform: translate(-120px,-80px) rotate(0deg)   scale(1.05); }
        100% { transform: translate( 120px, 80px) rotate(360deg) scale(1.05); }
      }
      @keyframes drift2 {
        0%   { transform: translate( 140px,-100px) rotate(360deg) scale(1.2); }
        100% { transform: translate(-140px, 100px) rotate(0deg)   scale(1.2); }
      }

      @keyframes dashA { to { stroke-dashoffset: -600; } }
      @keyframes dashB { to { stroke-dashoffset:  600; } }

      @keyframes twinkle1 { 0%,100% { opacity: 0.12; } 50% { opacity: 0.45; } }
      @keyframes twinkle2 { 0%,100% { opacity: 0.08; } 50% { opacity: 0.35; } }
    </style>

    <rect width="1200" height="800" fill="url(#bg-dark)"/>

    <g mask="url(#fade-dark)" filter="url(#warp-dark)">
      <g id="grid1-dark">
        <rect x="-300" y="-300" width="1800" height="1400" fill="url(#triA-dark)"/>
      </g>
      <g id="grid2-dark">
        <rect x="-300" y="-300" width="1800" height="1400" fill="url(#triB-dark)"/>
      </g>
    </g>

    <rect width="1200" height="800" fill="url(#vignette-dark)"/>
  </svg>

  <svg class="site-bg__svg site-bg__svg--light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f7f2ff">
          <animate attributeName="stop-color" dur="70s" repeatCount="indefinite"
                   values="#f7f2ff;#f3ecff;#f7f2ff"/>
        </stop>
        <stop offset="55%" stop-color="#f3ecff">
          <animate attributeName="stop-color" dur="70s" repeatCount="indefinite"
                   values="#f3ecff;#f1e9ff;#f3ecff"/>
        </stop>
        <stop offset="100%" stop-color="#ddc4ff">
          <animate attributeName="stop-color" dur="70s" repeatCount="indefinite"
                   values="#ddc4ff;#e3d0ff;#ddc4ff"/>
        </stop>
      </linearGradient>

      <radialGradient id="fadeGrad-light" cx="50%" cy="50%" r="72%">
        <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="62%" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="fade-light" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="800">
        <rect width="1200" height="800" fill="url(#fadeGrad-light)"/>
      </mask>

      <filter id="warp-light" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.003" numOctaves="2" seed="6" result="noise">
          <animate attributeName="baseFrequency" dur="48s" repeatCount="indefinite"
                   values="0.0025;0.005;0.0025"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <pattern id="triA-light" width="180" height="155.884572681" patternUnits="userSpaceOnUse">
        <path class="lineA-light" d="
          M0 0 H180
          M0 155.884572681 H180
          M0 0 L90 155.884572681 L180 0
          M0 155.884572681 L90 0 L180 155.884572681
        "/>
      </pattern>

      <pattern id="triB-light" width="120" height="103.923048454" patternUnits="userSpaceOnUse">
        <path class="lineB-light" d="
          M0 0 H120
          M0 103.923048454 H120
          M0 0 L60 103.923048454 L120 0
          M0 103.923048454 L60 0 L120 103.923048454
        "/>
        <circle class="dot-light dot1" cx="0" cy="0" r="1.3"/>
        <circle class="dot-light dot2" cx="60" cy="103.923048454" r="1.3"/>
        <circle class="dot-light dot1" cx="120" cy="0" r="1.3"/>
        <circle class="dot-light dot2" cx="0" cy="103.923048454" r="1.3"/>
        <circle class="dot-light dot1" cx="120" cy="103.923048454" r="1.3"/>
      </pattern>

      <radialGradient id="vignette-light" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#35046b" stop-opacity="0.12"/>
      </radialGradient>
    </defs>

    <style>
      .lineA-light, .lineB-light { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
      .lineA-light { stroke: rgba(96,28,160,0.2); stroke-width: 1.05; stroke-dasharray: 10 22; animation: dashA 36s linear infinite; }
      .lineB-light { stroke: rgba(133,59,213,0.2); stroke-width: 0.95; stroke-dasharray: 5 18;  animation: dashB 48s linear infinite; }

      .dot-light { fill: rgba(133,59,213,0.26); }
      .dot1 { animation: twinkle1 12s ease-in-out infinite; }
      .dot2 { animation: twinkle2 14s ease-in-out infinite; }

      #grid1-light, #grid2-light { transform-origin: 600px 400px; }
      #grid1-light { animation: drift1 140s linear infinite; opacity: 0.85; }
      #grid2-light { animation: drift2 180s linear infinite; opacity: 0.45; mix-blend-mode: multiply; }

      @keyframes drift1 {
        0%   { transform: translate(-120px,-80px) rotate(0deg)   scale(1.05); }
        100% { transform: translate( 120px, 80px) rotate(360deg) scale(1.05); }
      }
      @keyframes drift2 {
        0%   { transform: translate( 140px,-100px) rotate(360deg) scale(1.2); }
        100% { transform: translate(-140px, 100px) rotate(0deg)   scale(1.2); }
      }

      @keyframes dashA { to { stroke-dashoffset: -600; } }
      @keyframes dashB { to { stroke-dashoffset:  600; } }

      @keyframes twinkle1 { 0%,100% { opacity: 0.12; } 50% { opacity: 0.45; } }
      @keyframes twinkle2 { 0%,100% { opacity: 0.08; } 50% { opacity: 0.35; } }
    </style>

    <rect width="1200" height="800" fill="url(#bg-light)"/>

    <g mask="url(#fade-light)" filter="url(#warp-light)">
      <g id="grid1-light">
        <rect x="-300" y="-300" width="1800" height="1400" fill="url(#triA-light)"/>
      </g>
      <g id="grid2-light">
        <rect x="-300" y="-300" width="1800" height="1400" fill="url(#triB-light)"/>
      </g>
    </g>

    <rect width="1200" height="800" fill="url(#vignette-light)"/>
  </svg>
</div>
