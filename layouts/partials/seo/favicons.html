{{ with .Site.Params.favicons }}
  {{/* Canonical minimal, deduplicated favicon set */}}
  <link
    rel="shortcut icon"
    href="{{ (.shortcut_icon | default "/images/icons/favicon.ico") | absURL }}"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{{ (.favicon_32 | default "/images/icons/favicon-32x32.png") | absURL }}"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="{{ (.favicon_16 | default "/images/icons/favicon-16x16.png") | absURL }}"
  />

  {{ with .favicon_svg }}
    <link rel="icon" type="image/svg+xml" href="{{ . | absURL }}" />
  {{ end }}


  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="{{ (.apple_touch_icon | default "/images/icons/apple-touch-icon.png") | absURL }}"
  />

  <link rel="manifest" href="{{ absLangURL "manifest.json" }}" />
{{ end }}
