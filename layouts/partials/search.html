{{/* ───────────────────────── Site Search ───────────────────────── */}}

<!-- Search Trigger Button -->
<button
  type="button"
  class="btn btn-link search-trigger"
  id="searchTrigger"
  aria-label="Open search"
  title="Search (Ctrl+K)"
>
  <wa-icon name="magnifying-glass" aria-hidden="true"></wa-icon>
</button>

<!-- Search Modal Overlay -->
<div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-labelledby="searchLabel">
  <div class="search-container">
    <div class="search-header">
      <label for="searchInput" id="searchLabel" class="visually-hidden">Search documentation</label>
      <div class="search-input-wrapper">
        <wa-icon name="magnifying-glass" class="search-input-icon" aria-hidden="true"></wa-icon>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search documentation..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <kbd class="search-kbd">ESC</kbd>
      </div>
      <button type="button" class="search-close" id="searchClose" aria-label="Close search">
        <wa-icon name="xmark" aria-hidden="true"></wa-icon>
      </button>
    </div>

    <div class="search-body">
      <!-- Search Results -->
      <div class="search-results" id="searchResults">
        <div class="search-empty" id="searchEmpty">
          <wa-icon name="lightbulb" class="search-empty-icon" aria-hidden="true"></wa-icon>
          <p>Start typing to search...</p>
          <div class="search-tips">
            <span><kbd>↑</kbd><kbd>↓</kbd> to navigate</span>
            <span><kbd>Enter</kbd> to select</span>
            <span><kbd>ESC</kbd> to close</span>
          </div>
        </div>
        <div class="search-no-results" id="searchNoResults" style="display: none;">
          <wa-icon name="face-frown" class="search-empty-icon" aria-hidden="true"></wa-icon>
          <p>No results found for "<span id="searchQueryDisplay"></span>"</p>
          <p class="text-muted small">Try different keywords or browse categories below</p>
        </div>
        <ul class="search-results-list" id="searchResultsList" role="listbox"></ul>
      </div>

      <!-- Quick Links when empty -->
      <div class="search-quick-links" id="searchQuickLinks">
        <h6 class="search-section-title">Popular</h6>
        <div class="search-quick-grid">
          <a href="/guides/quick-start/" class="search-quick-link">
            <wa-icon name="rocket" aria-hidden="true"></wa-icon>
            Quick Start
          </a>
          <a href="/docs/gql-reference/" class="search-quick-link">
            <wa-icon name="code" aria-hidden="true"></wa-icon>
            GQL Reference
          </a>
          <a href="/docs/client-libraries/" class="search-quick-link">
            <wa-icon name="plug" aria-hidden="true"></wa-icon>
            Client Libraries
          </a>
          <a href="/docs/tutorials/" class="search-quick-link">
            <wa-icon name="graduation-cap" aria-hidden="true"></wa-icon>
            Tutorials
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  /* Search Trigger Button */
  .search-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
    color: var(--color-neutral-600);
    transition: color var(--duration-fast) var(--ease-out);
  }

  .search-trigger:hover {
    color: var(--color-primary-600);
  }

  /* Search Overlay */
  .search-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
    opacity: 0;
    transition: opacity var(--duration-fast) var(--ease-out);
  }

  .search-overlay.active {
    display: flex;
    opacity: 1;
  }

  /* Search Container */
  .search-container {
    width: 100%;
    max-width: 640px;
    margin: 0 1rem;
    background: var(--color-neutral-0, #fff);
    border-radius: var(--radius-xl, 1rem);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    transform: translateY(-20px);
    transition: transform var(--duration-fast) var(--ease-out);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .search-overlay.active .search-container {
    transform: translateY(0);
  }

  /* Search Header */
  .search-header {
    display: flex;
    align-items: center;
    padding: 1rem;
    border-bottom: 1px solid var(--color-neutral-200, #e5e7eb);
    gap: 0.75rem;
  }

  .search-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--color-neutral-100, #f3f4f6);
    border-radius: var(--radius-lg, 0.5rem);
    padding: 0.75rem 1rem;
  }

  .search-input-icon {
    color: var(--color-neutral-400);
    flex-shrink: 0;
  }

  .search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 1rem;
    color: var(--color-neutral-900);
    outline: none;
  }

  .search-input::placeholder {
    color: var(--color-neutral-400);
  }

  .search-kbd {
    background: var(--color-neutral-200);
    color: var(--color-neutral-600);
    padding: 0.125rem 0.5rem;
    border-radius: var(--radius-sm, 0.25rem);
    font-size: 0.75rem;
    font-family: inherit;
    border: 1px solid var(--color-neutral-300);
  }

  .search-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border: none;
    background: transparent;
    color: var(--color-neutral-500);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--duration-fast) var(--ease-out);
  }

  .search-close:hover {
    background: var(--color-neutral-100);
    color: var(--color-neutral-700);
  }

  /* Search Body */
  .search-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
  }

  /* Empty State */
  .search-empty,
  .search-no-results {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--color-neutral-500);
  }

  .search-empty-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  .search-tips {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    font-size: 0.8125rem;
  }

  .search-tips kbd {
    background: var(--color-neutral-200);
    padding: 0.125rem 0.375rem;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    margin-right: 0.25rem;
  }

  /* Results List */
  .search-results-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .search-result-item {
    margin-bottom: 0.25rem;
  }

  .search-result-link {
    display: block;
    padding: 0.875rem 1rem;
    border-radius: var(--radius-md);
    text-decoration: none;
    color: var(--color-neutral-900);
    transition: all var(--duration-fast) var(--ease-out);
  }

  .search-result-link:hover,
  .search-result-link.active {
    background: var(--color-primary-50);
    color: var(--color-primary-700);
  }

  .search-result-link.active {
    outline: 2px solid var(--color-primary-500);
    outline-offset: -2px;
  }

  .search-result-title {
    font-weight: 600;
    font-size: 0.9375rem;
    margin-bottom: 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .search-result-title mark {
    background: var(--color-warning-200);
    color: inherit;
    padding: 0 0.125rem;
    border-radius: 2px;
  }

  .search-result-badge {
    font-size: 0.6875rem;
    font-weight: 500;
    padding: 0.125rem 0.5rem;
    border-radius: var(--radius-full, 9999px);
    background: var(--color-neutral-100);
    color: var(--color-neutral-600);
    text-transform: uppercase;
    letter-spacing: 0.025em;
  }

  .search-result-badge.badge-guide {
    background: var(--color-success-100, #dcfce7);
    color: var(--color-success-700, #15803d);
  }

  .search-result-badge.badge-docs {
    background: var(--color-primary-100);
    color: var(--color-primary-700);
  }

  .search-result-badge.badge-tag {
    background: var(--color-warning-100, #fef3c7);
    color: var(--color-warning-700, #a16207);
  }

  .search-result-excerpt {
    font-size: 0.8125rem;
    color: var(--color-neutral-600);
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .search-result-excerpt mark {
    background: var(--color-warning-100);
    color: inherit;
    padding: 0 0.125rem;
    border-radius: 2px;
  }

  /* Quick Links */
  .search-quick-links {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--color-neutral-200);
  }

  .search-section-title {
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--color-neutral-500);
    margin-bottom: 0.75rem;
  }

  .search-quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
  }

  .search-quick-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.625rem 0.75rem;
    border-radius: var(--radius-md);
    text-decoration: none;
    color: var(--color-neutral-700);
    font-size: 0.875rem;
    font-weight: 500;
    transition: all var(--duration-fast) var(--ease-out);
  }

  .search-quick-link:hover {
    background: var(--color-neutral-100);
    color: var(--color-primary-600);
  }

  .search-quick-link wa-icon {
    color: var(--color-neutral-400);
    transition: color var(--duration-fast) var(--ease-out);
  }

  .search-quick-link:hover wa-icon {
    color: var(--color-primary-500);
  }

  /* Dark mode support */
  [data-bs-theme="dark"] .search-container {
    background: var(--color-neutral-900, #171717);
    border: 1px solid var(--color-neutral-700);
  }

  [data-bs-theme="dark"] .search-header {
    border-bottom-color: var(--color-neutral-700);
  }

  [data-bs-theme="dark"] .search-input-wrapper {
    background: var(--color-neutral-800);
  }

  [data-bs-theme="dark"] .search-input {
    color: var(--color-neutral-100);
  }

  [data-bs-theme="dark"] .search-kbd {
    background: var(--color-neutral-700);
    color: var(--color-neutral-300);
    border-color: var(--color-neutral-600);
  }

  [data-bs-theme="dark"] .search-result-link:hover,
  [data-bs-theme="dark"] .search-result-link.active {
    background: rgba(156, 77, 255, 0.15);
  }

  [data-bs-theme="dark"] .search-result-title {
    color: var(--color-neutral-100);
  }

  [data-bs-theme="dark"] .search-result-excerpt {
    color: var(--color-neutral-400);
  }

  [data-bs-theme="dark"] .search-quick-links {
    border-top-color: var(--color-neutral-700);
  }

  [data-bs-theme="dark"] .search-quick-link {
    color: var(--color-neutral-300);
  }

  [data-bs-theme="dark"] .search-quick-link:hover {
    background: var(--color-neutral-800);
  }

  /* Mobile adjustments */
  @media (max-width: 640px) {
    .search-overlay {
      padding-top: 0;
      align-items: stretch;
    }

    .search-container {
      max-width: none;
      margin: 0;
      border-radius: 0;
      max-height: 100vh;
      height: 100vh;
    }

    .search-quick-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<script>
(function() {
  // Elements
  const trigger = document.getElementById('searchTrigger');
  const overlay = document.getElementById('searchOverlay');
  const container = overlay?.querySelector('.search-container');
  const input = document.getElementById('searchInput');
  const closeBtn = document.getElementById('searchClose');
  const resultsList = document.getElementById('searchResultsList');
  const emptyState = document.getElementById('searchEmpty');
  const noResults = document.getElementById('searchNoResults');
  const queryDisplay = document.getElementById('searchQueryDisplay');
  const quickLinks = document.getElementById('searchQuickLinks');

  if (!overlay || !input) return;

  // State
  let searchIndex = null;
  let activeIndex = -1;
  let debounceTimer = null;

  // Load search index
  async function loadSearchIndex() {
    if (searchIndex) return searchIndex;
    try {
      const response = await fetch('/index.json');
      searchIndex = await response.json();
      return searchIndex;
    } catch (e) {
      console.error('Failed to load search index:', e);
      return [];
    }
  }

  // Open search
  function openSearch() {
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    input.focus();
    loadSearchIndex();
  }

  // Close search
  function closeSearch() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    input.value = '';
    resultsList.innerHTML = '';
    emptyState.style.display = 'block';
    noResults.style.display = 'none';
    quickLinks.style.display = 'block';
    activeIndex = -1;
  }

  // Highlight matches
  function highlight(text, query) {
    if (!query || !text) return text || '';
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  // Get badge class
  function getBadgeClass(url) {
    if (url.includes('/guides/')) return 'badge-guide';
    if (url.includes('/docs/')) return 'badge-docs';
    if (url.includes('/tags/')) return 'badge-tag';
    return '';
  }

  // Get badge label
  function getBadgeLabel(url) {
    if (url.includes('/guides/')) return 'Guide';
    if (url.includes('/docs/tutorials/')) return 'Tutorial';
    if (url.includes('/docs/')) return 'Docs';
    if (url.includes('/tags/')) return 'Topic';
    if (url.includes('/categories/')) return 'Category';
    return 'Page';
  }

  // Create excerpt with highlighted matches
  function createExcerpt(content, query, maxLength = 150) {
    if (!content || !query) return '';

    const lowerContent = content.toLowerCase();
    const lowerQuery = query.toLowerCase();
    const idx = lowerContent.indexOf(lowerQuery);

    let start = 0;
    if (idx > 50) {
      start = idx - 50;
    }

    let excerpt = content.slice(start, start + maxLength);
    if (start > 0) excerpt = '...' + excerpt;
    if (start + maxLength < content.length) excerpt += '...';

    return highlight(excerpt, query);
  }

  // Search function
  function search(query) {
    if (!searchIndex || !query.trim()) {
      resultsList.innerHTML = '';
      emptyState.style.display = 'block';
      noResults.style.display = 'none';
      quickLinks.style.display = 'block';
      return;
    }

    const q = query.toLowerCase().trim();
    const words = q.split(/\s+/).filter(w => w.length > 1);

    // Score each result
    const scored = searchIndex.map(item => {
      let score = 0;
      const title = (item.title || '').toLowerCase();
      const content = (item.content || '').toLowerCase();
      const tags = (item.tags || []).map(t => t.toLowerCase());
      const url = (item.permalink || '').toLowerCase();

      // Exact title match (highest priority)
      if (title === q) score += 100;
      else if (title.includes(q)) score += 50;

      // Word matches in title
      words.forEach(word => {
        if (title.includes(word)) score += 20;
        if (title.startsWith(word)) score += 10;
      });

      // Tag matches
      tags.forEach(tag => {
        if (tag === q) score += 30;
        words.forEach(word => {
          if (tag.includes(word)) score += 15;
        });
      });

      // URL matches (for section names)
      words.forEach(word => {
        if (url.includes(word)) score += 5;
      });

      // Content matches (lower priority)
      words.forEach(word => {
        const matches = (content.match(new RegExp(word, 'gi')) || []).length;
        score += Math.min(matches, 10) * 2;
      });

      // Boost certain sections
      if (url.includes('/guides/')) score *= 1.2;
      if (url.includes('/docs/tutorials/')) score *= 1.1;

      return { ...item, score };
    })
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);

    // Render results
    emptyState.style.display = 'none';
    quickLinks.style.display = scored.length > 0 ? 'none' : 'block';

    if (scored.length === 0) {
      noResults.style.display = 'block';
      queryDisplay.textContent = query;
      resultsList.innerHTML = '';
      return;
    }

    noResults.style.display = 'none';
    resultsList.innerHTML = scored.map((item, idx) => `
      <li class="search-result-item" role="option" id="search-result-${idx}">
        <a href="${item.permalink}" class="search-result-link" tabindex="-1">
          <div class="search-result-title">
            ${highlight(item.title, query)}
            <span class="search-result-badge ${getBadgeClass(item.permalink)}">${getBadgeLabel(item.permalink)}</span>
          </div>
          <div class="search-result-excerpt">${createExcerpt(item.content, query)}</div>
        </a>
      </li>
    `).join('');

    activeIndex = -1;
  }

  // Handle keyboard navigation
  function handleKeydown(e) {
    const items = resultsList.querySelectorAll('.search-result-link');

    switch (e.key) {
      case 'ArrowDown':
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, items.length - 1);
        updateActiveItem(items);
        break;
      case 'ArrowUp':
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, -1);
        updateActiveItem(items);
        break;
      case 'Enter':
        if (activeIndex >= 0 && items[activeIndex]) {
          items[activeIndex].click();
        }
        break;
      case 'Escape':
        closeSearch();
        break;
    }
  }

  function updateActiveItem(items) {
    items.forEach((item, idx) => {
      item.classList.toggle('active', idx === activeIndex);
      if (idx === activeIndex) {
        item.scrollIntoView({ block: 'nearest' });
      }
    });
  }

  // Event listeners
  trigger?.addEventListener('click', openSearch);
  closeBtn?.addEventListener('click', closeSearch);

  overlay?.addEventListener('click', (e) => {
    if (e.target === overlay) closeSearch();
  });

  input?.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => search(e.target.value), 150);
  });

  input?.addEventListener('keydown', handleKeydown);

  // Global keyboard shortcut (Ctrl+K or Cmd+K)
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      if (overlay.classList.contains('active')) {
        closeSearch();
      } else {
        openSearch();
      }
    }
  });
})();
</script>
