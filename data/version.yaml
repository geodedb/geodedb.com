# Geode Version Information
# The site resolves the latest version from GitLab at build time
# (see layouts/partials/geode/version-data.html — it reads the newest
# semver-ordered release tag via the GitLab Tags API).
# These values act as fallbacks (used only when the GitLab API is
# unreachable at build time) plus the source of truth for non-GitLab
# metadata such as client library versions and development-channel labels.

# Fallback current release version
current: 0.6.10

# Fallback display version
display: 0.6.10

# Fallback semantic version
semver: 0.6.10

# Latest development version (includes unreleased main-branch changes)
development: 0.6.11-dev

# Release date (ISO 8601 format)
release_date: '2026-06-01'

# Client library versions
clients:
  go: 0.1.21
  python: 0.3.20
  rust: 0.1.1-alpha.21
  zig: 0.2.10
  nodejs: 1.0.1
  ui: 0.1.1

# Docker image tags
docker:
  latest: latest
  stable: v0.6.10
  development: v0.6.11-dev

# GitLab project metadata
gitlab:
  project_path: devnw/codepros/geode/geode
  project_url: https://gitlab.com/devnw/codepros/geode/geode

# Fallback release URL
release_url: https://gitlab.com/devnw/codepros/geode/geode/-/releases

# Fallback changelog URL
changelog_url: https://gitlab.com/devnw/codepros/geode/geode/-/blob/main/CHANGELOG.md
