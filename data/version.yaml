# Geode Version Information
# The site now resolves the latest version from GitLab at build time.
# These values act as fallbacks plus the source of truth for non-GitLab metadata
# such as client library versions and development-channel labels.

# Fallback current release version
current: 0.2.15

# Fallback display version
display: 0.2.15

# Fallback semantic version
semver: 0.2.15

# Latest development version (includes unreleased main-branch changes)
development: 0.2.16-dev

# Release date (ISO 8601 format)
release_date: '2026-03-29'

# Client library versions
clients:
  go: rolling
  python: 0.3.19
  rust: 0.1.1-alpha.8
  zig: 0.1.0
  nodejs: 1.0.0-alpha.15

# Docker image tags
docker:
  latest: latest
  stable: v0.2.15
  development: v0.2.16-dev

# GitLab project metadata
gitlab:
  project_path: devnw/codepros/geode/geode
  project_url: https://gitlab.com/devnw/codepros/geode/geode

# Fallback release URL
release_url: https://gitlab.com/devnw/codepros/geode/geode/-/releases

# Fallback changelog URL
changelog_url: https://gitlab.com/devnw/codepros/geode/geode/-/blob/main/CHANGELOG.md
