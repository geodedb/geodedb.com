  zig: "0.1.3"
  nodejs: "0.1.3"

# Docker image tags
docker:
  latest: "latest"
  stable: "v0.1.3"
  development: "v0.1.4-alpha.4"

# GitLab release URL
release_url: "https://gitlab.com/devnw/codepros/geode/-/releases"

# Changelog URL
