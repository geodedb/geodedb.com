# GitLab CI/CD configuration for Geode documentation site
# Builds and deploys Hugo site to GitLab Pages at geodedb.com

image: ubuntu:24.04

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  HUGO_VERSION: "0.139.4"
  DART_SASS_VERSION: "1.80.7"
  CI: "true"

before_script:
  - apt-get update && apt-get install -y wget git ca-certificates
  - make deps
  - export PATH="/usr/local/bin:$PATH"
  - which hugo
  - which sass
  - hugo version
  - sass --version

test:
  stage: test
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://geodedb.com
