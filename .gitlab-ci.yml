# GitLab CI/CD configuration for Geode documentation site
# Builds and deploys Hugo site to GitLab Pages at geodedb.com

image: ubuntu:24.04

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  HUGO_VERSION: "0.139.4"

before_script:
  - apt-get update && apt-get install -y wget git curl
  # Install Hugo Extended (includes embedded Dart Sass since 0.114.0)
  - wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
  - tar -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
  - mv hugo /usr/local/bin/
  - hugo version
  - hugo env

test:
  stage: test
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://geodedb.com
