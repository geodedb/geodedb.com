# GitLab CI/CD configuration for Geode documentation site
# Builds and deploys Hugo site to GitLab Pages at geodedb.com

image: nixos/nix:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  NIX_CONFIG: "experimental-features = nix-command flakes"

before_script:
  - nix --version
  - nix flake show --no-write-lock-file

.nix_build: &nix_build
  script:
    - nix develop --accept-flake-config --command hugo version
    - nix develop --accept-flake-config --command make build

test:
  stage: test
  <<: *nix_build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  <<: *nix_build
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://geodedb.com
