# GitLab CI/CD configuration for Geode documentation site
#
# Deployment Strategy:
# - Main branch     -> GitLab Pages   -> dev.geodedb.com (development/preview)
# - Release branch  -> Cloudflare Pages -> geodedb.com (production) [AUTOMATIC]
#
# This ensures production deployments are intentional (release branch) while
# development changes are automatically deployed for preview.

image: ubuntu:26.04

default:
  tags:
    - company
    - linux

include:
  - component: gitlab.com/devnw/ci-catalog/cloudflare-pages-deploy@v1.45.4
    inputs:
      stage: deploy
      project_name: geodedb-com
      output_dir: public

variables:
  GIT_SUBMODULE_STRATEGY: none
  HUGO_ENV: production
  HUGO_VERSION: "0.139.4"
  DART_SASS_VERSION: "1.80.7"
  CI: "true"
  DEBIAN_FRONTEND: noninteractive

stages:
  - test
  - deploy

# =============================================================================
# Common Setup - Hugo Build Environment
# =============================================================================
.setup:
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget git ca-certificates curl make
    # Install Node.js 20 (required for wrangler)
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y -qq nodejs
    - echo "Cloning private submodules with CI token..."
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - git submodule sync --recursive
    - git submodule update --init --recursive --depth=1
    - echo "Installing Hugo and Dart Sass..."
    - make deps 2>&1 | tail -20
    - export PATH="/usr/local/bin:$PATH"
    - echo "Verifying installations..."
    - hugo version
    - sass --version
    - node --version
    - npm --version
    - echo "Installing npm packages..."
    - npm install --quiet
    - echo "Build environment ready!"

# =============================================================================
# Test Stage
# =============================================================================

# Test build for merge requests and non-default branches
test:
  extends: .setup
  stage: test
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Link validation for all branches
link-check:
  extends: .setup
  stage: test
  script:
    # First, check source markdown files for broken internal links
    # This catches missing files before the build
    - echo "Checking markdown source files for broken links..."
    - ./scripts/check-links.sh
    # Build the site
    - hugo -b https://geodedb.com --minify --gc
    # Install htmltest for link checking
    - curl -fsSL https://htmltest.wjdp.uk | bash -s -- -b /usr/local/bin
    # Run link checker on built HTML
    - htmltest --conf .htmltest.yml
  rules:
    - if: $CI_COMMIT_BRANCH

# =============================================================================
# Deploy Stage - GitLab Pages (Development)
# =============================================================================

# Deploy to GitLab Pages on main branch -> dev.geodedb.com
pages:
  extends: .setup
  stage: deploy
  script:
    # Build with dev subdomain as base URL
    - hugo -b https://dev.geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: development
    url: https://dev.geodedb.com

# =============================================================================
# Deploy Stage - Cloudflare Pages (Production)
# =============================================================================

# Override component job to add Hugo build before deploy.
# The component provides id_tokens, secrets (CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID), and variables for Vault auth automatically.
cloudflare-pages-deploy:
  extends: .setup
  image: ubuntu:26.04
  script:
    - hugo -b https://geodedb.com --minify --gc
    # Vault secrets are file-type variables; read contents for wrangler
    - |
      if [ -f "$CLOUDFLARE_ACCOUNT_ID" ]; then
        export CLOUDFLARE_ACCOUNT_ID=$(cat "$CLOUDFLARE_ACCOUNT_ID")
      fi
      if [ -f "$CLOUDFLARE_API_TOKEN" ]; then
        export CLOUDFLARE_API_TOKEN=$(cat "$CLOUDFLARE_API_TOKEN")
      fi
    - npx wrangler pages deploy public --project-name=geodedb-com --branch=release --commit-dirty=true
  rules:
    # Automatically deploy on release branch
    - if: $CI_COMMIT_BRANCH == "release"
    # Manual deploy from main branch (for hotfixes without release)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  environment:
    name: production
    url: https://geodedb.com
