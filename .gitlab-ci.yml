# GitLab CI/CD configuration for Geode documentation site
# Builds and deploys Hugo site to GitLab Pages at geodedb.com

image: ubuntu:24.04

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  HUGO_VERSION: "0.131.0"
  DART_SASS_VERSION: "1.77.8"

before_script:
  - apt-get update && apt-get install -y wget git curl
  # Install Hugo Extended
  - wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
  - dpkg -i hugo_extended_${HUGO_VERSION}_linux-amd64.deb
  # Install Dart Sass
  - wget -q https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
  - tar -xzf dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz
  - mv dart-sass/* /usr/local/bin/
  - sass --version
  - hugo version

test:
  stage: test
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - hugo -b https://geodedb.com --minify --gc
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://geodedb.com
